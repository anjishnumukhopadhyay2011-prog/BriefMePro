<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BriefMe &mdash; Reset Password</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1A1815">
    <link rel="stylesheet" href="/static/auth.css" />
  </head>
  <body>

    <!-- Animated background -->
    <div class="auth-bg">
      <canvas id="authParticles"></canvas>
    </div>

    <div class="auth-page" style="align-items:center; justify-content:center;">
      <div style="width:100%; max-width:420px; padding:24px 16px;">
        <div class="auth-card">

          <div class="auth-brand">
            <div class="auth-brand-dot"></div>
            <span class="auth-brand-name">BriefMe</span>
          </div>

          <h1 class="auth-title">Set new password</h1>
          <p class="auth-subtitle">Choose a strong password for your account.</p>

          <div id="resetBanner" class="auth-banner"></div>

          <form id="resetForm" autocomplete="on" novalidate>

            <div class="auth-field">
              <label class="auth-label" for="password">New password</label>
              <div class="auth-input-wrap">
                <input
                  id="password"
                  class="auth-input has-btn"
                  type="password"
                  name="password"
                  autocomplete="new-password"
                  required
                  placeholder="At least 8 characters"
                />
                <button type="button" class="show-pw-btn" id="showPw" aria-label="Show password"></button>
              </div>
              <div class="strength-wrap" id="strengthWrap" data-level="">
                <div class="strength-bar">
                  <div class="strength-segment"></div>
                  <div class="strength-segment"></div>
                  <div class="strength-segment"></div>
                  <div class="strength-segment"></div>
                </div>
                <span class="strength-label"></span>
              </div>
            </div>

            <div class="auth-field">
              <label class="auth-label" for="confirm">Confirm password</label>
              <div class="auth-input-wrap">
                <input
                  id="confirm"
                  class="auth-input has-btn"
                  type="password"
                  name="confirm"
                  autocomplete="new-password"
                  required
                  placeholder="Repeat password"
                />
                <button type="button" class="show-pw-btn" id="showConfirm" aria-label="Show password"></button>
                <span class="match-indicator" id="matchIndicator"></span>
              </div>
            </div>

            <button type="submit" class="cta-btn" id="submitBtn">Reset password</button>

          </form>

          <div class="auth-footer">
            Back to <a href="/login">Sign in &rsaquo;</a>
          </div>

        </div>
      </div>
    </div>

    <script src="/static/auth.js"></script>
    <script>
      initParticles("authParticles");
      bindShowHide("password", "showPw");
      bindShowHide("confirm", "showConfirm");
      bindStrengthMeter("password", "strengthWrap");
      bindConfirmMatch("password", "confirm", "matchIndicator");

      const token = new URLSearchParams(window.location.search).get("token") || "";
      if (!token) {
        showBanner("resetBanner", "error", "Invalid reset link. Please request a new one.");
        document.getElementById("submitBtn").disabled = true;
      }

      document.getElementById("resetForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const password = document.getElementById("password").value;
        const confirm  = document.getElementById("confirm").value;
        if (password.length < 8) { showBanner("resetBanner", "error", "Password must be at least 8 characters."); return; }
        if (password !== confirm) { showBanner("resetBanner", "error", "Passwords do not match."); return; }
        await submitForm({
          url: "/api/auth/reset-password",
          data: { token, password },
          btnEl: document.getElementById("submitBtn"),
          btnLoadText: "Saving\u2026",
          btnReadyText: "Reset password",
          bannerId: "resetBanner",
          onSuccess() {
            showBanner("resetBanner", "success", "Password updated. Redirecting to sign in\u2026");
            setTimeout(() => window.location.href = "/login", 1500);
          },
        });
      });
    </script>

  </body>
</html>
