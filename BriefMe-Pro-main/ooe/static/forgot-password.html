<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BriefMe &mdash; Forgot Password</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1A1815">
    <link rel="stylesheet" href="/static/auth.css" />
  </head>
  <body>

    <!-- Animated background -->
    <div class="auth-bg">
      <canvas id="authParticles"></canvas>
    </div>

    <div class="auth-page">
      <div class="auth-split">

        <!-- ── Left branding panel ── -->
        <div class="auth-left">
          <div class="auth-left-brand">
            <div class="auth-logo-ring">
              <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="24" cy="24" r="22" stroke="rgba(103,233,255,0.25)" stroke-width="1"/>
                <path d="M24 2 A22 22 0 0 1 46 24" stroke="rgba(103,233,255,0.9)" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M24 46 A22 22 0 0 1 2 24" stroke="rgba(61,245,192,0.6)" stroke-width="1" stroke-linecap="round"/>
              </svg>
              <div class="auth-logo-core"></div>
            </div>
            <span class="auth-left-wordmark">BriefMe</span>
          </div>

          <h2 class="auth-left-headline">Recover<br>your access.</h2>
          <p class="auth-left-sub">
            We'll send a secure reset link straight to your inbox.
            You'll be back in the cockpit in under a minute.
          </p>

          <div class="auth-stats">
            <div class="auth-stat">
              <span class="auth-stat-dot"></span>
              <span class="auth-stat-label">Live events tracked</span>
              <span class="auth-stat-value" id="statEvents">&mdash;</span>
            </div>
            <div class="auth-stat">
              <span class="auth-stat-dot" style="background:var(--amber);box-shadow:0 0 8px var(--amber)"></span>
              <span class="auth-stat-label">Active sources</span>
              <span class="auth-stat-value" id="statSources">&mdash;</span>
            </div>
            <div class="auth-stat">
              <span class="auth-stat-dot" style="background:var(--accent);box-shadow:0 0 8px var(--accent)"></span>
              <span class="auth-stat-label">System status</span>
              <span class="auth-stat-value" style="color:var(--teal)">Operational</span>
            </div>
          </div>
        </div>

        <!-- ── Right form panel ── -->
        <div class="auth-right">
          <div class="auth-card">

            <div class="auth-brand">
              <div class="auth-brand-dot"></div>
              <span class="auth-brand-name">BriefMe</span>
            </div>

            <h1 class="auth-title">Forgot password</h1>
            <p class="auth-subtitle">Enter your email and we&rsquo;ll send a reset link.</p>

            <div id="forgotBanner" class="auth-banner"></div>

            <form id="forgotForm" autocomplete="on" novalidate>

              <div class="auth-field">
                <label class="auth-label" for="email">Email address</label>
                <div class="auth-input-wrap">
                  <input
                    id="email"
                    class="auth-input"
                    type="email"
                    name="email"
                    autocomplete="email"
                    required
                    placeholder="you@example.com"
                  />
                </div>
              </div>

              <button type="submit" class="cta-btn" id="submitBtn">Send reset link</button>

            </form>

            <div class="auth-footer">
              Remembered it? <a href="/login">Sign in &rsaquo;</a>
            </div>

          </div>
        </div>

      </div>
    </div>

    <script src="/static/auth.js"></script>
    <script>
      initParticles("authParticles");
      loadAuthStats();

      const form = document.getElementById("forgotForm");
      const btn  = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        if (!email || !email.includes("@")) { showBanner("forgotBanner", "error", "Enter a valid email."); return; }
        await submitForm({
          url: "/api/auth/forgot-password",
          data: { email },
          btnEl: btn,
          btnLoadText: "Sending\u2026",
          btnReadyText: "Send reset link",
          bannerId: "forgotBanner",
          onSuccess() {
            showBanner("forgotBanner", "success", "If that email is registered, a reset link is on its way. Check your inbox.");
            document.getElementById("email").value = "";
          },
        });
      });
    </script>

  </body>
</html>
