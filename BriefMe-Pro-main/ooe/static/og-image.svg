<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="g" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1a1f3a" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#07080b"/>
    </radialGradient>
    <radialGradient id="globe" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a3a5a"/>
      <stop offset="60%" stop-color="#141a2a"/>
      <stop offset="100%" stop-color="#07080b"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>

  <!-- subtle dot grid -->
  <g fill="#9ab4ff" opacity="0.06">
    <circle cx="100" cy="100" r="1.5"/><circle cx="200" cy="100" r="1.5"/>
    <circle cx="300" cy="100" r="1.5"/><circle cx="1100" cy="200" r="1.5"/>
    <circle cx="1000" cy="500" r="1.5"/><circle cx="900" cy="120" r="1.5"/>
    <circle cx="80" cy="500" r="1.5"/><circle cx="180" cy="450" r="1.5"/>
  </g>

  <!-- globe glyph -->
  <g transform="translate(880,315)">
    <circle r="180" fill="url(#globe)" stroke="#9ab4ff" stroke-opacity="0.25" stroke-width="1.5"/>
    <ellipse rx="180" ry="60" fill="none" stroke="#9ab4ff" stroke-opacity="0.18" stroke-width="1"/>
    <ellipse rx="180" ry="120" fill="none" stroke="#9ab4ff" stroke-opacity="0.14" stroke-width="1"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#9ab4ff" stroke-opacity="0.18" stroke-width="1"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#9ab4ff" stroke-opacity="0.14" stroke-width="1"/>
    <!-- event pings -->
    <circle cx="-60" cy="-30" r="5" fill="#e06b74"/>
    <circle cx="-60" cy="-30" r="14" fill="none" stroke="#e06b74" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="40" cy="20" r="4" fill="#e8b776"/>
    <circle cx="40" cy="20" r="12" fill="none" stroke="#e8b776" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="-90" cy="60" r="3" fill="#7dd3b8"/>
    <circle cx="80" cy="-70" r="3" fill="#9ab4ff"/>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="-apple-system, 'Segoe UI Variable', 'Segoe UI', Roboto, sans-serif" fill="#f2f4f7">
    <text x="80" y="220" font-size="76" font-weight="600" letter-spacing="-2">BriefMe Pro</text>
    <text x="80" y="290" font-size="32" font-weight="400" fill="#b4bac3" letter-spacing="-0.5">Live geopolitical intelligence,</text>
    <text x="80" y="332" font-size="32" font-weight="400" fill="#b4bac3" letter-spacing="-0.5">mapped to Earth.</text>

    <!-- feature row -->
    <g font-size="18" fill="#8a8f98" letter-spacing="0.5">
      <text x="80" y="450">30 SOURCES</text>
      <text x="240" y="450">·</text>
      <text x="265" y="450">PER-USER PERSONALISATION</text>
      <text x="565" y="450">·</text>
      <text x="590" y="450">OPEN SOURCE</text>
    </g>

    <text x="80" y="540" font-size="20" fill="#9ab4ff" letter-spacing="0.5">briefme.pro</text>
  </g>
</svg>
